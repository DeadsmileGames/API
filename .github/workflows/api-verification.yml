name: API verification

on:
  push:
    branches: [main, Beta]
    paths:
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".env.example"
      - ".github/workflows/api-verification.yml"
  pull_request:
    branches: [main, Beta]

permissions:
  contents: read

concurrency:
  group: api-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test

  postgres-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: deadsmile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deadsmile_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: deadsmile_test
      FRONTEND_URL: https://deadsmilegames.onrender.com
      BACKEND_URL: https://api-ust8.onrender.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bootstrap and verify the PostgreSQL schema
        shell: bash
        run: |
          export DATABASE_URL="$(printf 'postgresql://%s@%s:%s/%s' "$PGUSER" "$PGHOST" "$PGPORT" "$PGDATABASE")"
          export SESSION_SECRET="$(openssl rand -hex 32)"
          export DATA_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          npm run db:bootstrap
          npm run db:migrate
          npm run db:migrate
          npm run db:verify
